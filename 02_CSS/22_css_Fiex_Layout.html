        section{
            width: 800px;
            height: 300px;
            border: 2px solid red;
            display: flex;
            justify-content: space-evenly;


        }
        section > div {
            width: 100px;
            height: 100px;
            background-color: #ff0080;
            border: 1px solid red;
            box-shadow: 5px 5px 15px deeppink;   /*box shadow*/



        }

        section > div:nth-child(2){
            align-self: center;
        }

        section > div:nth-child(4){
            align-self: center;
        }

        section > div:nth-child(6){
            align-self: center;
        }

        section > div:nth-child(3){
            align-self: end;
        }
