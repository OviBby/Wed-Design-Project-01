<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="web, html, css, javascript, js, java, python">
    <meta name="description" content="World best web development tutorials">
    <meta name="author" content="IJSE">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zindex</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="assets/lib/normalize.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Betania+Patmos+In&family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        div{
            position: absolute;
        }

        #div1{
            width: 400px;
            height: 400px;
            background: #010f16;
            z-index: 3;
        }

        #div2{
            width: 300px;
            height: 300px;
            background: #1d6348;
            /*       z-index: 2;*/
            z-index: calc(infinity);
        }

        #div3{
            width: 200px;
            height: 200px;
            background: #1f3b48;
            z-index: 1;
        }

        #div4{
            width: 100px;
            height: 100px;
            background: #9b887a;
        }
    </style>


</head>

<body>
<div id="div1"></div>
<div id="div2"></div>
<div id="div3"></div>
<div id="div4"></div>
</body>

</html>
