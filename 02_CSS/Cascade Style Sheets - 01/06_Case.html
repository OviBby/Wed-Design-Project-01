<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="web, html, css, javascript, js, java, python">
    <meta name="description" content="World best web development tutorials">
    <meta name="author" content="IJSE">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Grid System</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="assets/lib/normalize.css">

    <style>

        section{
            width: 1000px;
            height: 600px;
            border: 3px solid black;

            display: grid;

            grid-template-columns: repeat(4 , 2fr);
        }
        section > div{

            border: 1px solid black;
        }

        section > div:first-child{

            background-color: #420f47;

            grid-column: 1/3;


            border: 2px solid rebeccapurple;
        }

        section > div:nth-child(2){
            background-color: purple;

            border: 2px solid rebeccapurple;
        }

        section > div:nth-child(3){

            background-color: rebeccapurple;
            grid-column: 4/5;
            grid-row: 1/4;
            border: 2px solid rebeccapurple;
        }

        section > div:nth-child(4){

            background-color: #ee00ff;



            border: 2px solid rebeccapurple;
        }

        section > div:nth-child(5){

            background-color: #dc8ce1;


            border: 2px solid rebeccapurple;
        }

        section > div:nth-child(6){

            background-color: #ff00dd;

            border: 2px solid rebeccapurple;
        }
        section > div:nth-child(7){

            background-color: #ff0080;



            border: 2px solid rebeccapurple;
        }

        section > div:nth-child(8){

            background-color: aquamarine;
            grid-column: 2/4;

            border: 2px solid rebeccapurple;
        }







    </style>

</head>

<body>

<section>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>





</section>





</body>

</html>
