<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
   var  a = 6;
   var b = 2;
   var c = 4;

   //Addition(+) Add two values together
   console.log(a+b); // 6+2 = 8

   //Subtraction(-) Subtract two values
   console.log(a-b);// 6-2 = 4

   //Multiplication(*) Multiply two values
   console.log(a*b); // 6*2 = 12

   //Division(/) Divide two values
   console.log(a/b); // 6/2 = 3

   //Modulo(%) Find the remainder of a division
   console.log(a%b); // 6%2 = 0
   console.log(a%c); // 6%4 = 2


</script>
</body>
</html>
