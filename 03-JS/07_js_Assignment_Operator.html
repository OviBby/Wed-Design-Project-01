    <meta charset="UTF-8">

<body>
<script>

    var a = 6;
    var b = 2;
    var c = a;

    //Addition assignment(+=):Add a value to a variable
    a+=b;// a= a+b

    //Subtraction assignment(-=):Subtract a value from a variable
    a-=b;//a= a-b

    //Multiplication assignment(*=):Multiply a value with a variable
    a*=b;//a= a*b

    //Division assignment(/=): Divide a value by a variable
    a/=b;

    //Modulo assignment(%=): Find the remainder of a division
    a%=b;


</script>
