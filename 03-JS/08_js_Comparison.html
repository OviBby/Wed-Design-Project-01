<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
 var a= 10;
 var b = 10;
 var c = 6;
 var d = "10";

//Equal to(==):check values
 console.log(a==b);//true
 console.log(a==d);//true
 console.log(a==c);//false

 //Inequality to(!=):check values
 console.log(a!=b);//false
 console.log(a!=d);//false
 console.log(a!=c);//true

 //Strict equal to(===):check values and types
 console.log(a===b);//true
 console.log(a===d);//false
 console.log(a===c);//false

 //Strict Inequality to(!==):check values and types
 console.log(a!==b);//false
 console.log(a!==d);//true
 console.log(a!==c);//true

 //Greater than(>): check if one value is less than another
 console.log(a>b);//false
 console.log(a>c);//true
 console.log(a>d);//false

 //Less than(<): check if one value is greater than another
 console.log(a<b);//true
 console.log(a<c);//false
 console.log(a<d);//true

 //Greater than equal to(>=): check if one value is greater than or equal to another
 console.log(a>=b);//true
 console.log(a>=c);//true
 console.log(a>=d);//false

 //Less than equal to(<=): check if one value is less than or equal to another
 console.log(a<=b);//true
 console.log(a<=c);//false
 console.log(a<=d);//true



</script>

</body>
</html>
