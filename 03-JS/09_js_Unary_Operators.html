<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>

   //Unary plus(+):Converts a value to a number
   var a = "10";
   console.log(a+2);//102
   console.log(+a+2);//12

   //Unary minus(-):Converts a value to a number
   var b = 10 ;
   console.log(b);//10
   console.log(-b);//-10

   //Case 01
   var y1 = 2;
   var r1 = 10 + y1++;
   console.log("r1",r1);//12

   //Case 02
   var y2 = 2;
   var r2 = 10 + ++y2;
   console.log("r2",r2);//13

   //Case 03
   var y3 = 2;
   var r3 = 10 + y3--;
   console.log("r3",r3);//12

   //Case 04
   var y4 = 2;
   var r4 = 10 + --y4;
   console.log("r4",r4);//11
</script>
</body>
</html>
