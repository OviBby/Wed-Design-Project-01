<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>


//for loop
 for(var i=0;i<=10;i++){
     console.log(i);
 }

//while loop
 let a = 1;
 while (a<=10){
     console.log(a);
     a++;
 }

 //do while loop
 let z = 1;
 do{
     console.log(z);
     z++;
 }while (z<=10);


//break
for(let i=1 ; i <= 5 ;i++){
    if(i==3)
        break;
    console.log(i);
}

console.log("======");


//continue
for(let i=1 ; i <= 5 ;i++){
    if(i==3)
        continue;
    console.log(i);
}

console.log("======");


var day = 2;
  switch (day){
      case "1":
          console.log("Monday");
          break;


      case "2":
          console.log("Tuesday");
          break;


      case "3":
          console.log("Wednesday");
          break;


      case "4":
          console.log("Thursday");
          break;

      case "5":
          console.log("Friday");
          break;

      case "6":
         console.log("SatuDay")  ;
      break;

      case "7":
          console.log("Sunday");
          break;

      default:
          console.log("Invalid day");
  }



</script>
</body>
</html>
